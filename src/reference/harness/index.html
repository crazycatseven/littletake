<!doctype html><html><head><meta charset="utf-8"><title>LittleTake reference quality harness</title><style>
body{margin:0;background:#f7f7f0;color:#27342c;font:15px system-ui}header{padding:16px;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{padding:9px 16px;background:#e6edda;border:1px solid #b4c29f;border-radius:6px;color:#30482e;cursor:pointer}button:disabled{opacity:.4;cursor:wait}main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:18px}aside video{width:100%}h1{font-size:19px;margin:0}#status{font-weight:600}#report{white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto}#images img{width:100%;max-width:1280px;display:block;margin-bottom:16px}.stage{position:relative;height:280px;border:1px solid #ddd}.preview{position:relative;width:100%;height:220px}#viewport{width:100%;height:100%}label{display:block;margin:12px 0}pre{font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}
 .playback-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 0}.playback-row video,.playback-row .preview{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#222}.playback-controls{display:flex;align-items:center;gap:10px;padding:8px 18px}.playback-controls p{margin:0}aside{min-width:0}</style></head><body><header><h1>Reference reconstruction quality</h1><button id="demo">Load demo</button><input id="file" type="file" accept="video/mp4,video/webm"><button id="extract" disabled>Extract source frames</button><button id="audit">Audit source again</button><button id="poses">Measure head landmarks</button><button id="run" disabled>Reconstruct and verify</button><button id="resume">Resume preserved run</button><button id="rebuild">Rebuild measured source</button><button id="raw" disabled>Render saved proposal</button><button id="fitted" disabled>Render calibration</button><button id="reviewRender" disabled>Review inspected render</button><button id="continue" disabled>Continue review</button><button id="stop" disabled>Stop</button></header>
<div class="playback-row"><section><p>Original clip</p><video id="sourceVideo" controls muted></video></section><section><p>Actual scene · active shot</p><div id="preview" class="preview"></div></section></div><div class="playback-controls"><button id="play">Play scene</button><button id="previous">Previous frame</button><button id="next">Next frame</button><p id="frameInfo"></p></div><main><aside><p id="status">Choose a clip</p><p id="cuts"></p><label>Run ID<input id="runId" style="width:100%" readonly></label><pre id="report"></pre><div class="stage"><div id="viewport"></div></div><label>Inspect round<select id="round"></select></label><pre id="logs"></pre></aside><section id="images"></section></main>
<script type="module">

const $=s=>document.querySelector(s),stage=new Stage({viewport:$('#viewport'),preview:$('#preview'),onSelect(){},onStatus(){},onTransform(){return false;}});stage.update(createEmptyScene(),0,[],false);

$('#audit').onclick=async()=>{if(run?.control||!run?.analysis||!run?.source||$('#stop').disabled===false)return;controller=new AbortController();const controls=[...document.querySelectorAll('header button:not(#stop),header input,#round')].map(element=>[element,element.disabled]);for(const [element] of controls)element.disabled=true;$('#stop').disabled=false;try{status('Decoding original-resolution face and torso details');run.source.detailSheet=await collectReferenceDetails(video,run.source,run.analysis,controller.signal);await checkpoint(run);status('Independently auditing body/head direction, door depth and background identity');const checked=await requestReferenceDraft({video,direction:run.direction??'',source:run.source,analysis:run.analysis,sourceReview:true},controller.signal,run.id);(run.observationHistory??=[]).push({time:new Date().toISOString(),analysis:structuredClone(run.analysis)});run.analysis=checked.analysis;if(run.next)run.next.analysis=structuredClone(checked.analysis);run.sourceReviewed=true;await checkpoint(run);draw();status('Source audit preserved; old observations and native proposals retained');}catch(error){status('FAILED · '+error.message);await checkpoint(run);}finally{for(const [element,disabled] of controls)element.disabled=disabled;$('#stop').disabled=true;}};
$('#poses').onclick=async()=>{if(!run?.analysis||!run?.source||$('#stop').disabled===false)return;controller=new AbortController();const controls=[...document.querySelectorAll('header button:not(#stop),header input,#round')].map(element=>[element,element.disabled]);for(const [element] of controls)element.disabled=true;$('#stop').disabled=false;try{status('Measuring original-source facial landmarks locally; no paid calls');run.source.detailSheet=await collectReferenceDetails(video,run.source,run.analysis,controller.signal);(run.observationHistory??=[]).push({time:new Date().toISOString(),analysis:structuredClone(run.analysis)});run.headMeasurements=groundFaceDirections(run.analysis,run.source.frames);if(run.next)run.next.analysis=structuredClone(run.analysis);await checkpoint(run);draw();$('#report').textContent=JSON.stringify(run.headMeasurements,null,2);status('Source head measurements preserved · '+run.headMeasurements.length+' matched faces · no model API calls');}catch(error){status('FAILED · '+error.message);await checkpoint(run);}finally{for(const [element,disabled] of controls)element.disabled=disabled;$('#stop').disabled=true;}};
$('#reviewRender').onclick=async()=>{if(run?.control||!inspectedEvidence||$('#stop').disabled===false)return;controller=new AbortController();const controls=[...document.querySelectorAll('header button:not(#stop),header input,#round')].map(element=>[element,element.disabled]);for(const [element] of controls)element.disabled=true;$('#stop').disabled=false;let reviewed=false;try{status('Independent review of this exact rendered candidate and its full motion video');const evidence=inspectedEvidence,observed=run.offlineInputs?.[run.inspected]?.analysis??run.analysis,result=await requestReferenceDraft({video,direction:run.direction??'',analysis:observed,review:evidence},controller.signal,run.id);reviewed=true;run.attempts.push({...evidence,analysis:structuredClone(observed),quality:result.quality});run.analysis=result.analysis;const within=referenceFramingMatches(evidence.measurements);if(result.quality?.approved&&within&&Object.values(result.quality.scores).every(value=>value>=MIN_REFERENCE_SCORE)){run.result=result;run.phase='passed';delete run.error;status('PASSED visual review and measured framing');}else{run.phase='reviewed';run.next=result;delete run.error;if(result.quality?.approved&&!within)run.error='Reviewer approval failed measured framing; candidate cannot be applied.';status('REJECTED · '+JSON.stringify(result.quality?.scores)+' · framing='+within);}await checkpoint(run);draw();}catch(error){status('FAILED · '+error.message);await checkpoint(run);}finally{for(const [element,disabled] of controls)element.disabled=disabled;$('#reviewRender').disabled=reviewed;$('#stop').disabled=true;}};
function draw(){if(!run)return;$('#raw').disabled=$('#fitted').disabled=!(run.next??run.initial); $('#round').innerHTML=run.attempts.map((a,i)=>'<option value="'+i+'">Round '+(i+1)+(a.quality?' · '+JSON.stringify(a.quality.scores):'')+'</option>').join('');$('#round').value=String(Math.max(0,run.attempts.length-1));$('#images').innerHTML=observationHTML()+(run.attempts.at(-1)?'<img alt="Original and rendered frames" src="'+run.attempts.at(-1).contactSheet+'">':'')+(run.source?'<img alt="Source frames" src="'+run.source.contactSheet+'">':'');$('#report').textContent=JSON.stringify({error:run.error,quality:run.attempts.map(a=>a.quality),metrics:run.attempts.map(a=>({maxCenter:Math.max(...a.measurements.map(m=>m.centerError)),maxHeight:Math.max(...a.measurements.map(m=>m.heightError))}))},null,2);}
function observationHTML(){if(!run.analysis||run.attempts.length)return '';return run.analysis.frames.map(frame=>{const source=run.source.frames.find(f=>Math.abs(f.time-frame.time)<.002);if(!source)return '';const boxes=frame.subjects.flatMap(s=>[{box:s.box,color:'#6cff9a'},...(s.headBox?[{box:s.headBox,color:'#ffe074'}]:[])]).map(({box:b,color})=>'<rect x="'+b[0]*640+'" y="'+b[1]*360+'" width="'+(b[2]-b[0])*640+'" height="'+(b[3]-b[1])*360+'" fill="none" stroke="'+color+'" stroke-width="2"/>').join('');return '<p>Original '+frame.time.toFixed(3)+'s · green=body, yellow=face</p><div style="position:relative;width:640px"><img src="'+source.dataUrl+'" style="margin:0"><svg viewBox="0 0 640 360" style="position:absolute;inset:0;width:100%;height:100%">'+boxes+'</svg></div>';}).join('');}
function motionHTML(evidence){return evidence.video?'<p>Actual full-timeline motion · 8 fps</p><video controls muted style="width:100%" src="'+evidence.video+'"></video>':'';}
async function load(file){controller?.abort();controller=new AbortController();video=await readReferenceVideo(file,controller.signal);if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(file);$('#sourceVideo').src=blobURL;run={id:crypto.randomUUID(),attempts:[]};$('#runId').value=run.id;$('#extract').disabled=$('#run').disabled=false;status('Clip ready · '+video.duration.toFixed(3)+'s');}
$('#demo').onclick=async()=>{const blob=await(await fetch('/demo/grand-budapest-zero/input-web.mp4')).blob();await load(new File([blob],'demo.mp4',{type:'video/mp4'}));};
$('#file').onchange=async()=>{if($('#file').files[0])await load($('#file').files[0]);};
$('#extract').onclick=async()=>{try{controller=new AbortController();status('Decoding source frames');run.source=await collectReferenceSource(video,controller.signal);$('#cuts').textContent='Decoded cut candidates: '+run.source.cuts.map(t=>t.toFixed(6)).join(', ');await checkpoint(run);draw();status('Source frames ready');}catch(error){status('FAILED · '+error.message);}};
$('#run').onclick=async()=>{if(run?.control)return;controller=new AbortController();$('#resume').disabled=$('#run').disabled=$('#extract').disabled=$('#demo').disabled=$('#file').disabled=true;$('#stop').disabled=false;try{const result=await reconstructReference({video,direction:run.direction??''},(scene,time,shotId,assets,measureVisible,view='shot',frameBounds)=>stage.captureSnapshot(scene,time,view,shotId,assets,measureVisible,frameBounds),controller.signal,status,run,async value=>{await checkpoint(value);draw();const last=value.attempts.at(-1);if((value.phase==='observed'||value.phase==='initial'||(value.phase==='reviewed'&&last?.quality&&!last.quality.approved))&&!value.result&&!value.error&&!controller.signal.aborted){status(value.phase==='observed'?"Paused for inspection of source observations":value.phase==='initial'?"Paused to inspect the actual Muse draft":"Paused for inspection of failed review");$("#continue").disabled=false;await new Promise(resolve=>{continueReview=resolve;});continueReview=null;$("#continue").disabled=true;}});status('PASSED visual review');stage.update(result.scene,0,[],false,result.scene.shots[0].id,result.assets??[]);}catch(error){status('FAILED · '+error.message);const last=run.attempts.at(-1);if(last)stage.update(last.scene,0,[],false,last.scene.shots[0].id,last.assets??[]);}finally{run.requests=await readDiagnostics('reference:'+run.id);await checkpoint(run);draw();$('#resume').disabled=$('#run').disabled=$('#extract').disabled=$('#demo').disabled=$('#file').disabled=false;$('#stop').disabled=true;}};
$('#stop').onclick=()=>{controller?.abort();continueReview?.();};
$('#continue').onclick=()=>continueReview?.();
$('#rebuild').onclick=async()=>{if(controller&&!controller.signal.aborted&&$('#stop').disabled===false)return;const source=structuredClone(run?.source);if(!source)return;run={id:crypto.randomUUID(),source,attempts:[]};inspectedScene=null;inspectedAssets=[];$('#runId').value=run.id;await checkpoint(run);draw();status('Measured source reused; next reconstruction starts with a fresh semantic observation');};
$('#resume').onclick=async()=>{const response=await fetch('/verification');const saved=await response.json();if(!response.ok){status(saved.error);return;}run=saved.run;video=saved.video;$('#runId').value=run.id;$('#run').disabled=!!run.control;$('#audit').disabled=!!run.control;$('#extract').disabled=false;$('#sourceVideo').src=video.dataUrl;draw();const kind=run.inspected??(run.offline?.fitted?'fitted':'raw'),candidate=run.offline?.[kind];if(candidate){run.inspected=kind;inspectedEvidence=candidate;inspectedScene=candidate.scene;inspectedAssets=candidate.assets??[];$('#images').innerHTML=motionHTML(candidate)+'<img alt="Restored inspected render" src="'+candidate.contactSheet+'">';$('#reviewRender').disabled=!!run.control||!run.offlineInputs?.[kind]?.analysis;stage.update(candidate.scene,0,[],false,candidate.scene.shots[0].id,inspectedAssets);}status(run.origin??'Preserved source and original Muse draft restored; no model calls made');};
$('#round').onchange=()=>{const attempt=run.attempts[Number($('#round').value)];$('#images').innerHTML=motionHTML(attempt)+'<img alt="Original and rendered frames" src="'+attempt.contactSheet+'">';};
function stopPlayback(){playing=false;$('#play').textContent='Play scene';$('#sourceVideo').pause();}
function frame(delta){stopPlayback();const scene=inspectedScene??run?.result?.scene??run?.attempts.at(-1)?.scene,frames=run?.analysis?.frames??run?.initial?.analysis?.frames;if(!scene||!frames)return;index=(index+delta+frames.length)%frames.length;const point=frames[index],shot=scene.shots[point.shotIndex];$('#sourceVideo').currentTime=point.time;stage.update(scene,point.time,[],true,shot.id,inspectedScene?inspectedAssets:(run.result??run.attempts.at(-1))?.assets??[]);$('#frameInfo').textContent='Shot '+(point.shotIndex+1)+' · '+point.time.toFixed(3)+'s';}
function calibrate(scene,draft,signal){return new Promise((resolve,reject)=>{signal.throwIfAborted();const worker=new Worker(new URL('./framing-worker.ts',import.meta.url),{type:'module'});let done=false;const finish=(error,value)=>{if(done)return;done=true;clearTimeout(timer);signal.removeEventListener('abort',abort);worker.terminate();error?reject(error):resolve(value);},abort=()=>finish(new DOMException('Cancelled','AbortError')),timer=setTimeout(()=>finish(new Error('Calibration exceeded its 60-second calculation limit. Native proposal retained.')),60_000);signal.addEventListener('abort',abort,{once:true});worker.onerror=event=>finish(new Error(event.message||'Calibration worker failed.'));worker.onmessage=({data})=>{if(data.error)finish(new Error(data.error));else if(data.scene)finish(null,data.scene);else if(data.progress)status('Calibration pass '+data.progress+' / 4 · native proposal retained');};worker.postMessage({scene,analysis:draft.analysis,bindings:draft.bindings,assets:draft.assets??[]});});}
async function offline(calibrateScene){const draft=run?.next??run?.initial;if(!draft)return;if(!$('#stop').disabled&&!continueReview)throw new Error('Wait for the current operation before rendering another candidate.');const ownsController=$('#stop').disabled;if(ownsController)controller=new AbortController();const active=controller,controls=[...document.querySelectorAll('header button:not(#stop),header input,#round')].map(element=>[element,element.disabled]);for(const [element] of controls)element.disabled=true;$('#stop').disabled=false;const kind=calibrateScene?'fitted':'raw';try{run.source.frameBounds??=await measureReferenceFrameBounds(run.source,active.signal);draft.analysis.frameBounds=run.source.frameBounds;if(run.analysis)run.analysis.frameBounds=run.source.frameBounds;status('Rendering '+(calibrateScene?'calibration':'saved proposal')+' without model calls');let scene=structuredClone(draft.scene);for(const camera of scene.cameras)camera.frameBounds=run.source.frameBounds;if(calibrateScene)scene=await calibrate(scene,draft,active.signal);const evidence=await referenceReview(scene,(s,t,id,assets,measureVisible,view='shot',frameBounds)=>stage.captureSnapshot(s,t,view,id,assets,measureVisible,frameBounds),active.signal,run.source,draft.analysis,draft.bindings,draft.assets??[]);if(!calibrateScene&&run.attempts.at(-1)&&JSON.stringify(run.attempts.at(-1).scene)===JSON.stringify(scene))run.attempts.at(-1).layoutSheet=evidence.layoutSheet;inspectedScene=scene;inspectedAssets=draft.assets??[];inspectedEvidence=evidence;(run.offline??={})[kind]=evidence;run.inspected=kind;(run.offlineInputs??={})[kind]={scene:structuredClone(scene),analysis:structuredClone(draft.analysis),bindings:structuredClone(draft.bindings),assetIds:(draft.assets??[]).map(asset=>asset.id)};await checkpoint(run);$('#images').innerHTML=motionHTML(evidence)+'<img alt="Offline source and render comparison" src="'+evidence.contactSheet+'">';stage.update(scene,0,[],false,scene.shots[0].id,inspectedAssets);status('Offline render preserved; no model calls');}catch(error){(run.calibrationErrors??=[]).push({time:new Date().toISOString(),kind,error:error.message,input:{scene:structuredClone(draft.scene),analysis:structuredClone(draft.analysis),assets:structuredClone(draft.assets??[]),bindings:structuredClone(draft.bindings)}});await checkpoint(run);throw error;}finally{for(const [element,disabled] of controls)element.disabled=disabled;$('#reviewRender').disabled=!!run.control||!inspectedEvidence;$('#continue').disabled=!continueReview;$('#stop').disabled=ownsController||active.signal.aborted;}}
$('#raw').onclick=()=>offline(false).catch(error=>status('FAILED · '+error.message));$('#fitted').onclick=()=>offline(true).catch(error=>status('FAILED · '+error.message));
$('#play').onclick=()=>{if(playing){stopPlayback();return;}const scene=inspectedScene??run?.result?.scene??run?.attempts.at(-1)?.scene;if(!scene)return;playing=true;$('#play').textContent='Stop playback';const source=$('#sourceVideo');source.currentTime=0;source.play().catch(error=>{stopPlayback();status('Playback failed · '+error.message);});function tick(){if(!playing)return;const time=source.ended?scene.duration:Math.min(scene.duration,source.currentTime),shot=shotAtTime(scene,time);stage.update(scene,time,[],true,shot?.id,inspectedScene?inspectedAssets:(run.result??run.attempts.at(-1))?.assets??[]);$('#frameInfo').textContent=(shot?.name??'')+' · '+time.toFixed(3)+'s';if(time>=scene.duration){stopPlayback();return;}requestAnimationFrame(tick);}requestAnimationFrame(tick);};
$('#next').onclick=()=>frame(1);$('#previous').onclick=()=>frame(-1);
</script></body></html>
