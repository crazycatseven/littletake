app = "littletake-reference"
primary_region = "ewr"

[build]
  dockerfile = "server/reference/jobs/Dockerfile"

[env]
  REFERENCE_HOST = "0.0.0.0"
  PORT = "8080"
  REFERENCE_DATA_DIR = "/data"
  REFERENCE_CALL_LIMIT = "72"

[[mounts]]
  source = "reference_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
