[project]
name = "littletake-reference-geometry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "numpy>=1.26.4,<2",
  "Pillow>=10.4,<13",
  "huggingface-hub>=0.34,<2",
  "einops>=0.8,<1",
  "timm>=1.0.17,<2",
  "psutil>=6",
  "scipy>=1.13,<2",
  "opencv-python-headless>=4.10,<4.12",
]

[project.optional-dependencies]
sam = [
  "ftfy==6.1.1",
  "regex",
  "iopath>=0.1.10",
  "pycocotools>=2.0.10",
  "setuptools>=70,<81",
  "triton-windows>=3.5,<3.6; sys_platform == 'win32'",
  "triton>=3.5,<3.6; sys_platform == 'linux'",
]

body = [
  "braceexpand>=0.1.7",
  "omegaconf>=2.3",
  "pytorch-lightning>=2.4,<3",
  "roma>=1.5",
  "yacs>=0.1.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
