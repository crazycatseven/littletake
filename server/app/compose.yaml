services:
  app:
    image: littletake:local
    build:
      context: ../..
      dockerfile: server/app/Dockerfile
    restart: unless-stopped
    init: true
    env_file: /etc/littletake/app.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /srv/littletake/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LITTLETAKE_DOMAIN: littletake.crazycat.ai
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/littletake/caddy/data:/data
      - /srv/littletake/caddy/config:/config
